# Builds the Windows installers (TenderPilot-Setup.exe and TenderPilot-Demo-Setup.exe) on a GitHub Windows machine.
# The finished files are attached to the run as the artifact "TenderPilot-installers".
name: Build Windows installer

on:
  push:
    branches: [main, "feature/**"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write  # publish the GitHub Release that installed copies update from

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    # (each waiting step below has its own time limit, so a stuck step fails instead of hanging)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web interface packages
        working-directory: frontend
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\python -m pip install -r backend\requirements.txt pyinstaller

      - name: Run the tests
        working-directory: backend
        run: ..\.venv\Scripts\python -m pytest -q

      - name: OCR engine (Tesseract) and language data
        run: |
          choco install tesseract -y --no-progress
          if (-not (Test-Path "C:\Program Files\Tesseract-OCR\tesseract.exe")) { throw "Tesseract not installed" }
          New-Item -ItemType Directory -Force backend\data\tessdata | Out-Null
          foreach ($l in "eng", "hin", "osd") {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata/raw/main/$l.traineddata" -OutFile "backend\data\tessdata\$l.traineddata"
          }

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installers
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Smoke test the packaged program
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\tp-smoke"
          $p = Start-Process packaging\dist\TenderPilot\TenderPilot.exe -ArgumentList "--demo","--no-browser" -PassThru
          $ok = $false
          foreach ($i in 1..90) {
            Start-Sleep 2
            foreach ($port in 8471, 8472) {
              try { $r = Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 2; if ($r.app -eq "TenderPilot") { $ok = $true; break } } catch {}
            }
            if ($ok) { break }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "The packaged TenderPilot did not start" }

      - name: Update test (install, add data, update silently, data still there)
        shell: pwsh
        run: |
          function Wait-Up([int]$port) {
            foreach ($i in 1..90) { try { return Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 2 } catch { Start-Sleep 2 } }
            throw "TenderPilot did not answer on port $port"
          }
          $setup = (Resolve-Path installer\TenderPilot-Setup.exe).Path
          # 1. first installation (silent: TenderPilot starts by itself without a browser)
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru; $p.WaitForExit(600000) | Out-Null
          if (-not $p.HasExited) { throw "First installation did not finish" }
          $h = Wait-Up 8471; Write-Host "Installed and running: version $($h.version)"
          # 2. some data
          $tok = (Invoke-RestMethod -Method Post http://127.0.0.1:8471/api/v1/setup -ContentType application/json -Body (@{
            org_name = "Update Test Co"; name = "Admin"; email = "admin@test.local"; password = "update-test-12345" } | ConvertTo-Json)).token
          $hdr = @{ Authorization = "Bearer $tok" }
          Invoke-RestMethod -Method Post http://127.0.0.1:8471/api/v1/tenders -Headers $hdr -ContentType application/json -Body (@{
            title = "Tender kept across updates"; tender_ref = "UPD/1"; department = "Test"; bidder_type = "entity" } | ConvertTo-Json) | Out-Null
          # 3. update exactly as the app does it: TenderPilot stops, the installer runs silently and starts it again
          Get-Process TenderPilot -ErrorAction SilentlyContinue | Stop-Process -Force
          $p = Start-Process $setup -ArgumentList "/SILENT","/SUPPRESSMSGBOXES","/NORESTART","/CLOSEAPPLICATIONS" -PassThru; $p.WaitForExit(600000) | Out-Null
          if (-not $p.HasExited) { throw "Update installation did not finish" }
          $h = Wait-Up 8471; Write-Host "Restarted after update: version $($h.version)"
          # 4. data still there
          $tok2 = (Invoke-RestMethod -Method Post http://127.0.0.1:8471/api/v1/auth/login -ContentType application/json -Body (@{
            email = "admin@test.local"; password = "update-test-12345" } | ConvertTo-Json)).token
          $titles = (Invoke-RestMethod http://127.0.0.1:8471/api/v1/tenders -Headers @{ Authorization = "Bearer $tok2" }).title
          if ($titles -notcontains "Tender kept across updates") { throw "Data was lost in the update" }
          Write-Host "Data kept across the update: OK"
          Get-Process TenderPilot -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Network access test (staff computers reach the server over HTTPS)
        shell: pwsh
        run: |
          $cfg = "$env:LOCALAPPDATA\TenderPilot\data\server.json"
          Set-Content -Path $cfg -Value '{"network": true, "port": 8471, "https": true}' -Encoding ascii
          $exe = "$env:LOCALAPPDATA\Programs\TenderPilot\TenderPilot.exe"
          $p = Start-Process $exe -ArgumentList "--no-browser" -PassThru
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike "127.*" -and $_.IPAddress -notlike "169.254.*" } | Select-Object -First 1).IPAddress
          $ok = $null
          foreach ($i in 1..60) { try { $ok = Invoke-RestMethod "https://${ip}:8471/api/health" -SkipCertificateCheck -TimeoutSec 3; break } catch { Start-Sleep 2 } }
          if (-not $ok -or -not $ok.https) { throw "TenderPilot was not reachable over HTTPS on $ip" }
          Write-Host "Reached over the network at https://${ip}:8471 (version $($ok.version))"
          try { Invoke-RestMethod "http://${ip}:8471/api/health" -TimeoutSec 3 | Out-Null; throw "Plain HTTP must not be served" } catch { if ($_.Exception.Message -eq "Plain HTTP must not be served") { throw } }
          $tok = (Invoke-RestMethod -Method Post "https://${ip}:8471/api/v1/auth/login" -SkipCertificateCheck -ContentType application/json -Body (@{
            email = "admin@test.local"; password = "update-test-12345" } | ConvertTo-Json)).token
          if (-not $tok) { throw "Staff sign-in over the network failed" }
          Write-Host "Staff sign-in over the network: OK"
          # Settings > Network access > Restart TenderPilot now: the old copy stops and a new one comes back by itself
          $h = @{ Authorization = "Bearer $tok" }
          Invoke-RestMethod -Method Post "https://${ip}:8471/api/v1/network/restart" -Headers $h -SkipCertificateCheck | Out-Null
          if (-not $p.WaitForExit(30000)) { throw "The old TenderPilot did not stop for the restart" }
          $back = $null
          foreach ($i in 1..60) { try { $back = Invoke-RestMethod "https://${ip}:8471/api/health" -SkipCertificateCheck -TimeoutSec 3; break } catch { Start-Sleep 2 } }
          if (-not $back) { throw "TenderPilot did not come back after Restart" }
          Write-Host "Restart from Settings: TenderPilot came back by itself"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process TenderPilot -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item $cfg

      - uses: actions/upload-artifact@v4
        with:
          name: TenderPilot-installers
          path: installer/*.exe
          retention-days: 30

      # On main only: publish the version as a GitHub Release once. Installed copies of TenderPilot check this release
      # (Settings & audit > Software update) and download the installer with its checksum.
      - name: Publish release (main branch, new version only)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Select-String -Path backend\app\version.py -Pattern 'APP_VERSION = "([\d.]+)"').Matches[0].Groups[1].Value
          $tag = "v$ver"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already published; raise APP_VERSION to publish an update."; exit 0 }
          Get-ChildItem installer\*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($_.FullName).sha256" -Value "$h  $($_.Name)" -NoNewline -Encoding ascii
          }
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($ver))\s*\r?\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "TenderPilot $ver" }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          # Server package: installer + checksum + server guide in one zip (for copying to a server)
          $dir = "TenderPilot-$ver"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item installer\TenderPilot-Setup.exe, installer\TenderPilot-Setup.exe.sha256 $dir
          Copy-Item packaging\INSTALL-ON-SERVER.txt "$dir\INSTALL-ON-SERVER.txt"
          Compress-Archive -Path $dir -DestinationPath "installer\$dir-Windows-Setup.zip" -CompressionLevel Optimal
          $zh = (Get-FileHash "installer\$dir-Windows-Setup.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "installer\$dir-Windows-Setup.zip.sha256" -Value "$zh  $dir-Windows-Setup.zip" -NoNewline -Encoding ascii
          gh release create $tag (Get-ChildItem installer\*.exe, installer\*.zip, installer\*.sha256 | ForEach-Object FullName) --title "TenderPilot $ver" --notes-file release-notes.md
          if ($LASTEXITCODE) { throw "Could not publish the release" }
